<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip-b">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="fox-amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="fox-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip-b)">
    <!-- Centered Badge System -->
    <g transform="translate(512, 512)">

      <!-- 1. Master Orbit Ring (Like WalPulse Whale Circle) -->
      <circle cx="0" cy="0" r="370" fill="none" stroke="#0f172a" stroke-width="40" />

      <!-- 2. The Leaping Fox Silhouette (Monolithic Charcoal Body) -->
      <!-- Smooth, elegant curves: ears erect, muzzle forward, chest full, legs aerodynamic -->
      <path d="
        M -80,-190
        C -60,-240 -10,-280 20,-280
        C 35,-280 40,-250 35,-220
        L 85,-270
        C 105,-270 120,-240 100,-200
        L 140,-160
        L 260,-130
        C 275,-125 270,-105 250,-100
        L 180,-75
        C 220,-30 230,50 190,120
        L 130,170
        L 110,250
        L 70,220
        L 60,160
        C 10,180 -50,170 -110,130
        C -180,80 -230,0 -240,-90
        C -245,-140 -210,-170 -150,-175
        Z
      " fill="#0f172a" />

      <!-- 3. Fox White Breast & Cheek Mask (Crisp Negative Space) -->
      <path d="
        M 85,-175
        L 170,-120
        L 230,-115
        L 155,-90
        C 175,-50 170,10 135,70
        L 90,115
        C 110,70 110,-20 80,-70
        C 65,-95 40,-120 20,-135
        L 55,-160
        Z
      " fill="#ffffff" />

      <!-- 4. Inner Ear Electric Cyan Highlights -->
      <polygon points="10,-255 18,-225 3,-235" fill="url(#fox-cyan-grad)" />
      <polygon points="85,-245 92,-215 75,-225" fill="url(#fox-cyan-grad)" />

      <!-- 5. Fox Eye (Intelligent Cyan Diamond) -->
      <polygon points="135,-140 160,-130 148,-118 128,-125" fill="#00f5ff" />
      <circle cx="144" cy="-128" r="3.5" fill="#0f172a" />

      <!-- 6. Black Nose Point -->
      <circle cx="262" cy="-115" r="8" fill="#0f172a" />

      <!-- 7. The Saga Compensation Wave & DAG Loop (Sweeping Cyan Arc Across Ring) -->
      <!-- Intersects the bottom orbit ring just like WalPulse's pulse line -->
      <path d="
        M -240,-90
        C -280,20 -280,160 -200,250
        C -120,340 0,380 120,350
        C 220,320 310,230 350,120
      " fill="none" stroke="url(#fox-cyan-grad)" stroke-width="24" stroke-linecap="round" />

      <!-- DAG Nodes along the Saga Arc -->
      <!-- Node 1 (Start/Trigger) -->
      <circle cx="-200" cy="250" r="18" fill="#0f172a" />
      <circle cx="-200" cy="250" r="11" fill="#00f5ff" />
      <circle cx="-200" cy="250" r="4.5" fill="#ffffff" />

      <!-- Node 2 (Saga Backward Compensation Anchor - Golden Amber) -->
      <circle cx="120" cy="350" r="22" fill="#0f172a" />
      <circle cx="120" cy="350" r="14" fill="#f59e0b" />
      <circle cx="120" cy="350" r="6" fill="#ffffff" />

      <!-- Node 3 (Durable Snapshot Endpoint) -->
      <circle cx="350" cy="120" r="18" fill="#0f172a" />
      <circle cx="350" cy="120" r="11" fill="#00f5ff" />
      <circle cx="350" cy="120" r="4.5" fill="#ffffff" />

      <!-- Directed Arrows on Arc (Showing DAG Execution Direction) -->
      <polygon points="260,285 295,250 280,298" fill="#00f5ff" />

      <!-- 8. Central Nexus Heart Token on Fox Shoulder -->
      <circle cx="-20" cy="-20" r="20" fill="#ffffff" />
      <circle cx="-20" cy="-20" r="14" fill="#0f172a" />
      <circle cx="-20" cy="-20" r="8" fill="#00f5ff" />
    </g>
  </g>
</svg>