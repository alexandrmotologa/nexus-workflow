<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip-a">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="grad-falcon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="grad-falcon-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip-a)">
    <!-- Centered Badge System -->
    <g transform="translate(512, 512)">

      <!-- 1. The Hexagonal Architecture Frame (Like IdemGate & Order Engine) -->
      <!-- Points for hexagon centered at (0,0), radius ~390 -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="40" stroke-linejoin="round" />

      <!-- 2. The Falcon Silhouette (Monolithic Geometric Raptor in Soaring Profile/Flight) -->
      <!-- Head and Torso -->
      <path d="
        M 0,-280
        C 45,-280 85,-250 105,-205
        L 180,-175
        L 140,-130
        L 170,-115
        L 110,-70
        C 120,-30 115,20 90,80
        L 150,230
        L 75,270
        L 0,330
        L -75,270
        L -150,230
        L -90,80
        C -115,20 -120,-30 -110,-70
        L -170,-115
        L -140,-130
        L -180,-175
        L -105,-205
        C -85,-250 -45,-280 0,-280 Z
      " fill="#0f172a" />

      <!-- Wings - Sweeping Outward Geometric Blades (Parallel Virtual Threads) -->
      <!-- Left Wing Blade -->
      <path d="
        M -110,-70
        L -290,-150
        L -230,-40
        L -300,-10
        L -210,60
        L -260,110
        L -130,130
        L -90,80
        Z
      " fill="#0f172a" />

      <!-- Right Wing Blade -->
      <path d="
        M 110,-70
        L 290,-150
        L 230,-40
        L 300,-10
        L 210,60
        L 260,110
        L 130,130
        L 90,80
        Z
      " fill="#0f172a" />

      <!-- 3. Wing Inset Accents (Electric Cyan Velocity Slots) -->
      <path d="M -240,-90 L -170,-60 L -180,-15 L -250,-45 Z" fill="url(#grad-falcon-cyan)" />
      <path d="M -210,15 L -150,45 L -170,80 L -220,55 Z" fill="url(#grad-falcon-cyan)" />

      <path d="M 240,-90 L 170,-60 L 180,-15 L 250,-45 Z" fill="url(#grad-falcon-cyan)" />
      <path d="M 210,15 L 150,45 L 170,80 L 220,55 Z" fill="url(#grad-falcon-cyan)" />

      <!-- 4. Falcon Chest Core - Hexagonal Negative Space Cutout -->
      <polygon points="
        0,-60
        52,-30
        52,30
        0,60
        -52,30
        -52,-30
      " fill="#ffffff" />

      <!-- 5. Central Nexus Jewel Node (Inside Hex Core) -->
      <circle cx="0" cy="0" r="22" fill="#0f172a" />
      <circle cx="0" cy="0" r="14" fill="#00f5ff" />
      <circle cx="0" cy="0" r="6" fill="#ffffff" />

      <!-- 6. Integrated DAG Directed Flow Vector (From Tail Through Core to Head) -->
      <g stroke="url(#grad-falcon-amber)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
        <line x1="0" y1="210" x2="0" y2="95" />
        <polyline points="-25,130 0,95 25,130" fill="none" />
      </g>
      <circle cx="0" cy="210" r="15" fill="#f59e0b" />
      <circle cx="0" cy="210" r="7" fill="#ffffff" />

      <!-- 7. Focused Cyan Eyes -->
      <polygon points="-45,-215 -18,-205 -32,-190" fill="#00f5ff" />
      <polygon points="45,-215 18,-205 32,-190" fill="#00f5ff" />

      <!-- 8. Golden Beak Tip Accent -->
      <polygon points="0,-180 18,-150 -18,-150" fill="url(#grad-falcon-amber)" />

      <!-- 9. Head Crown Nexus Node -->
      <circle cx="0" cy="-240" r="8" fill="#00f5ff" />
    </g>
  </g>
</svg>