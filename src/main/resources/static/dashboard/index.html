<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWorkflow — Real-Time DAG Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-surface: #111827;
            --bg-card: #1a2234;
            --bg-card-hover: #222d44;
            --border-color: #2a364f;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 1.1rem;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .brand-badge {
            font-size: 0.7rem;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            padding: 0.2rem 0.5rem;
            border-radius: 9999px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-family: 'JetBrains Mono', monospace;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: #04101e;
        }

        .btn-primary:hover {
            background-color: #7dd3fc;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .btn-secondary {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--bg-card-hover);
        }

        .btn-signal {
            background-color: var(--accent-yellow);
            color: #1a1002;
            font-weight: 600;
        }

        .btn-signal:hover {
            background-color: #fbbf24;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }

        .layout-container {
            display: grid;
            grid-template-columns: 320px 1fr 360px;
            flex: 1;
            height: calc(100vh - 65px);
            overflow: hidden;
        }

        /* Sidebar: Workflow Instances */
        .sidebar {
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .section-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .instance-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .instance-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .instance-card:hover {
            background-color: var(--bg-card-hover);
            border-color: #3b4968;
        }

        .instance-card.active {
            border-color: var(--accent-blue);
            background-color: rgba(56, 189, 248, 0.05);
        }

        .instance-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent-blue);
            margin-bottom: 0.25rem;
        }

        .instance-def {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .instance-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .status-badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
            text-transform: uppercase;
        }

        .status-RUNNING { background: rgba(56, 189, 248, 0.2); color: var(--accent-blue); }
        .status-WAITING_SIGNAL { background: rgba(245, 158, 11, 0.2); color: var(--accent-yellow); animation: pulse 2s infinite; }
        .status-SLEEPING { background: rgba(168, 85, 247, 0.2); color: var(--accent-purple); }
        .status-COMPLETED { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
        .status-FAILED { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
        .status-PENDING { background: rgba(148, 163, 184, 0.2); color: var(--text-secondary); }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* Main Workspace: SVG Visualizer */
        .visualizer-area {
            display: flex;
            flex-direction: column;
            background-color: #0c101c;
            background-image: radial-gradient(#1a243b 1px, transparent 1px);
            background-size: 24px 24px;
            overflow: hidden;
            position: relative;
        }

        .visualizer-toolbar {
            background-color: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .active-wf-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .dag-canvas {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        svg.dag-svg {
            overflow: visible;
        }

        .node-rect {
            rx: 10;
            ry: 10;
            stroke-width: 2;
            transition: all 0.3s ease;
        }

        .node-rect.pending { fill: #172033; stroke: #2a364f; }
        .node-rect.running { fill: #132742; stroke: var(--accent-blue); filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5)); }
        .node-rect.waiting { fill: #2b2311; stroke: var(--accent-yellow); filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.5)); }
        .node-rect.completed { fill: #0f2d24; stroke: var(--accent-green); }
        .node-rect.failed { fill: #331316; stroke: var(--accent-red); }

        .node-label {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            fill: var(--text-primary);
            text-anchor: middle;
        }

        .node-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            fill: var(--text-muted);
            text-anchor: middle;
        }

        .edge-path {
            fill: none;
            stroke: #2a364f;
            stroke-width: 2;
            stroke-dasharray: 4 4;
            transition: all 0.3s ease;
        }

        .edge-path.active {
            stroke: var(--accent-blue);
            stroke-dasharray: none;
            stroke-width: 2.5;
        }

        .edge-path.completed {
            stroke: var(--accent-green);
            stroke-dasharray: none;
            stroke-width: 2.5;
        }

        /* Right Panel: State & History Audit */
        .detail-panel {
            background-color: var(--bg-surface);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
            background-color: rgba(56, 189, 248, 0.05);
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .json-box {
            background-color: #0a0e17;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #38bdf8;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 250px;
            overflow-y: auto;
        }

        .event-timeline {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .event-item {
            background-color: var(--bg-card);
            border-left: 3px solid var(--accent-blue);
            padding: 0.6rem 0.8rem;
            border-radius: 0 6px 6px 0;
            font-size: 0.75rem;
        }

        .event-item.STEP_COMPLETED { border-left-color: var(--accent-green); }
        .event-item.SIGNAL_WAITING { border-left-color: var(--accent-yellow); }
        .event-item.STEP_FAILED { border-left-color: var(--accent-red); }
        .event-item.WORKFLOW_COMPLETED { border-left-color: var(--accent-green); }

        .event-name {
            font-weight: 600;
            margin-bottom: 0.2rem;
            display: flex;
            justify-content: space-between;
        }

        .event-time {
            color: var(--text-muted);
            font-size: 0.7rem;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(4, 8, 16, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 480px;
            max-width: 90vw;
            padding: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.35rem;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.875rem;
            font-family: inherit;
        }

        .form-textarea {
            font-family: 'JetBrains Mono', monospace;
            resize: vertical;
            height: 100px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon">N</div>
            <span class="brand-title">NexusWorkflow</span>
            <span class="brand-badge">v0.1.0 LTS</span>
        </div>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="openSwagger()">API Docs</button>
            <button class="btn btn-primary" onclick="openStartModal()">+ New Execution</button>
        </div>
    </header>

    <div class="layout-container">
        <!-- Sidebar: Executions List -->
        <aside class="sidebar">
            <div class="section-header">
                <span class="section-title">Executions</span>
                <button class="btn btn-secondary" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;" onclick="loadInstances()">Refresh</button>
            </div>
            <div class="instance-list" id="instanceList">
                <div style="padding: 1rem; text-align: center; color: var(--text-muted); font-size: 0.8rem;">Loading instances...</div>
            </div>
        </aside>

        <!-- Main Area: SVG DAG Visualizer -->
        <main class="visualizer-area">
            <div class="visualizer-toolbar">
                <div class="active-wf-title">
                    <span id="activeDefTitle" style="font-weight: 600;">No Workflow Selected</span>
                    <span id="activeStatusBadge" class="status-badge status-PENDING">IDLE</span>
                </div>
                <div style="display: flex; gap: 0.5rem;">
                    <button id="signalBtn" class="btn btn-signal" style="display: none;" onclick="openSignalModal()">⚡ Inject Signal</button>
                </div>
            </div>
            <div class="dag-canvas" id="dagContainer">
                <svg id="dagSvg" class="dag-svg" width="800" height="400">
                    <text x="400" y="200" text-anchor="middle" fill="#64748b">Select or trigger an execution to inspect live DAG</text>
                </svg>
            </div>
        </main>

        <!-- Right Panel: State & Audit History -->
        <aside class="detail-panel">
            <div class="panel-tabs">
                <button class="tab-btn active" onclick="switchTab('state')">Live State</button>
                <button class="tab-btn" onclick="switchTab('history')">Event Audit</button>
            </div>
            <div id="stateTab" class="tab-content">
                <div style="margin-bottom: 1rem;">
                    <span class="section-title" style="display: block; margin-bottom: 0.5rem;">Current Step Output</span>
                    <div id="outputBox" class="json-box">{}</div>
                </div>
                <div>
                    <span class="section-title" style="display: block; margin-bottom: 0.5rem;">Initial Input</span>
                    <div id="inputBox" class="json-box">{}</div>
                </div>
            </div>
            <div id="historyTab" class="tab-content" style="display: none;">
                <div class="event-timeline" id="eventTimeline">
                    <div style="color: var(--text-muted); font-size: 0.8rem;">No events yet</div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Start Workflow Modal -->
    <div id="startModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Start New Execution</h3>
                <button class="btn btn-secondary" onclick="closeStartModal()">✕</button>
            </div>
            <div class="form-group">
                <label class="form-label">Workflow Definition</label>
                <select id="defSelect" class="form-select">
                    <option value="user-onboarding">user-onboarding (Multi-step + Signal)</option>
                    <option value="trip-booking-saga">trip-booking-saga (Parallel + Rollback)</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Custom Workflow ID (Optional)</label>
                <input id="customIdInput" class="form-input" placeholder="e.g. usr_onboarding_101">
            </div>
            <div class="form-group">
                <label class="form-label">Input JSON</label>
                <textarea id="inputPayloadArea" class="form-textarea">{
  "userId": "usr_alexander",
  "destination": "Zurich"
}</textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeStartModal()">Cancel</button>
                <button class="btn btn-primary" onclick="submitStartWorkflow()">Start Execution</button>
            </div>
        </div>
    </div>

    <!-- Signal Modal -->
    <div id="signalModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Inject External Signal</h3>
                <button class="btn btn-secondary" onclick="closeSignalModal()">✕</button>
            </div>
            <div class="form-group">
                <label class="form-label">Signal Name</label>
                <input id="signalNameInput" class="form-input" value="ID_VERIFIED">
            </div>
            <div class="form-group">
                <label class="form-label">Signal Payload (JSON)</label>
                <textarea id="signalPayloadArea" class="form-textarea">{
  "approved": true,
  "approver": "SecurityLead",
  "verificationScore": 0.98
}</textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeSignalModal()">Cancel</button>
                <button class="btn btn-signal" onclick="submitSignal()">Deliver Signal</button>
            </div>
        </div>
    </div>

    <script>
        let currentWorkflowId = null;
        let sseSource = null;
        let definitionsMap = {};

        async function init() {
            await loadDefinitions();
            await loadInstances();
        }

        async function loadDefinitions() {
            try {
                const res = await fetch('/api/v1/workflows/definitions');
                const defs = await res.json();
                defs.forEach(d => definitionsMap[d.id] = d);
            } catch (e) {
                console.error("Failed to load definitions", e);
            }
        }

        async function loadInstances() {
            try {
                const res = await fetch('/api/v1/workflows?limit=25');
                const instances = await res.json();
                const container = document.getElementById('instanceList');
                if (instances.length === 0) {
                    container.innerHTML = '<div style="padding:1rem; text-align:center; color:var(--text-muted); font-size:0.8rem;">No workflow runs found. Click "+ New Execution" to start one.</div>';
                    return;
                }

                container.innerHTML = instances.map(i => `
                    <div class="instance-card ${i.id === currentWorkflowId ? 'active' : ''}" onclick="selectWorkflow('${i.id}')">
                        <div class="instance-id">${i.id}</div>
                        <div class="instance-def">${i.definitionId}</div>
                        <div class="instance-meta">
                            <span class="status-badge status-${i.status}">${i.status}</span>
                            <span>${new Date(i.createdAt).toLocaleTimeString()}</span>
                        </div>
                    </div>
                `).join('');

                if (!currentWorkflowId && instances.length > 0) {
                    selectWorkflow(instances[0].id);
                }
            } catch (e) {
                console.error("Failed to load instances", e);
            }
        }

        async function selectWorkflow(workflowId) {
            currentWorkflowId = workflowId;
            loadInstances();

            if (sseSource) {
                sseSource.close();
            }

            // Fetch initial status and history
            const [statusRes, histRes] = await Promise.all([
                fetch(`/api/v1/workflows/${workflowId}/status`),
                fetch(`/api/v1/workflows/${workflowId}/history`)
            ]);
            const instance = await statusRes.json();
            const history = await histRes.json();

            updateView(instance, history);

            // Connect live SSE
            sseSource = new EventSource(`/api/v1/workflows/${workflowId}/live`);
            sseSource.addEventListener('workflow-update', async (e) => {
                const data = JSON.parse(e.data);
                const updatedHistRes = await fetch(`/api/v1/workflows/${workflowId}/history`);
                const updatedHist = await updatedHistRes.json();
                updateView(data.instance, updatedHist);
            });
        }

        function updateView(instance, history) {
            document.getElementById('activeDefTitle').innerText = `${instance.definitionId} (${instance.id})`;
            const badge = document.getElementById('activeStatusBadge');
            badge.className = `status-badge status-${instance.status}`;
            badge.innerText = instance.status;

            document.getElementById('inputBox').innerText = JSON.stringify(instance.input, null, 2);
            document.getElementById('outputBox').innerText = JSON.stringify(instance.output, null, 2);

            // Toggle signal button if waiting
            const signalBtn = document.getElementById('signalBtn');
            if (instance.status === 'WAITING_SIGNAL') {
                signalBtn.style.display = 'inline-flex';
            } else {
                signalBtn.style.display = 'none';
            }

            // Render Events
            const timeline = document.getElementById('eventTimeline');
            timeline.innerHTML = history.map(ev => `
                <div class="event-item ${ev.eventType}">
                    <div class="event-name">
                        <span>#${ev.sequenceNumber} ${ev.eventType}</span>
                        <span class="event-time">${new Date(ev.timestamp).toLocaleTimeString()}</span>
                    </div>
                    <div style="color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; font-size:0.7rem;">
                        ${ev.details.stepId ? 'Step: ' + ev.details.stepId.value : ''}
                        ${ev.details.signalName ? 'Signal: ' + ev.details.signalName.value : ''}
                    </div>
                </div>
            `).reverse().join('');

            // Render SVG DAG
            renderDag(instance, history);
        }

        function renderDag(instance, history) {
            const def = definitionsMap[instance.definitionId];
            const svg = document.getElementById('dagSvg');

            if (!def) {
                svg.innerHTML = '<text x="400" y="200" text-anchor="middle" fill="#64748b">Workflow definition not found</text>';
                return;
            }

            const steps = def.steps;
            const nodeWidth = 140;
            const nodeHeight = 60;
            const gapX = 60;
            let currentX = 60;
            const centerY = 180;

            let elements = '';
            const completedStepIds = new Set();
            history.forEach(ev => {
                if (ev.eventType === 'STEP_COMPLETED' && ev.details.stepId) {
                    completedStepIds.add(ev.details.stepId.value);
                }
            });

            for (let i = 0; i < steps.length; i++) {
                const s = steps[i];
                const isCompleted = completedStepIds.has(s.stepId.value);
                const isCurrent = instance.currentStepId === s.stepId.value;
                const isWaiting = isCurrent && instance.status === 'WAITING_SIGNAL';

                let statusClass = 'pending';
                if (isCompleted) statusClass = 'completed';
                else if (isWaiting) statusClass = 'waiting';
                else if (isCurrent) statusClass = 'running';

                // Render node rect
                elements += `
                    <g transform="translate(${currentX}, ${centerY - nodeHeight/2})">
                        <rect class="node-rect ${statusClass}" width="${nodeWidth}" height="${nodeHeight}" />
                        <text class="node-label" x="${nodeWidth/2}" y="${nodeHeight/2 - 4}">${s.stepId.value}</text>
                        <text class="node-sub" x="${nodeWidth/2}" y="${nodeHeight/2 + 14}">${s.type}</text>
                    </g>
                `;

                // Render connector to next
                if (i < steps.length - 1) {
                    const startX = currentX + nodeWidth;
                    const endX = startX + gapX;
                    const edgeClass = isCompleted ? 'completed' : (isCurrent ? 'active' : '');
                    elements += `
                        <line class="edge-path ${edgeClass}" x1="${startX}" y1="${centerY}" x2="${endX}" y2="${centerY}" />
                        <polygon points="${endX},${centerY} ${endX-6},${centerY-4} ${endX-6},${centerY+4}" fill="${isCompleted ? '#10b981' : '#2a364f'}" />
                    `;
                }

                currentX += nodeWidth + gapX;
            }

            svg.setAttribute('width', Math.max(800, currentX + 60));
            svg.innerHTML = elements;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            if (tab === 'state') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('stateTab').style.display = 'block';
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('historyTab').style.display = 'block';
            }
        }

        function openStartModal() { document.getElementById('startModal').style.display = 'flex'; }
        function closeStartModal() { document.getElementById('startModal').style.display = 'none'; }
        function openSignalModal() { document.getElementById('signalModal').style.display = 'flex'; }
        function closeSignalModal() { document.getElementById('signalModal').style.display = 'none'; }
        function openSwagger() { window.open('/swagger-ui.html', '_blank'); }

        async function submitStartWorkflow() {
            const defId = document.getElementById('defSelect').value;
            const customId = document.getElementById('customIdInput').value.trim();
            let inputPayload = {};
            try {
                inputPayload = JSON.parse(document.getElementById('inputPayloadArea').value);
            } catch (e) {
                alert("Invalid JSON payload");
                return;
            }

            const res = await fetch(`/api/v1/workflows/${defId}/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ customId: customId || null, input: inputPayload })
            });

            if (res.ok) {
                const created = await res.json();
                closeStartModal();
                await loadInstances();
                selectWorkflow(created.id);
            } else {
                alert("Failed to start workflow");
            }
        }

        async function submitSignal() {
            const signalName = document.getElementById('signalNameInput').value.trim();
            let payload = {};
            try {
                payload = JSON.parse(document.getElementById('signalPayloadArea').value);
            } catch (e) {
                alert("Invalid JSON payload");
                return;
            }

            const res = await fetch(`/api/v1/workflows/${currentWorkflowId}/signals/${signalName}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ payload })
            });

            if (res.ok) {
                closeSignalModal();
            } else {
                alert("Failed to deliver signal");
            }
        }

        window.onload = init;
    </script>
</body>
</html>
